<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Agent Console</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #070b14; color: #edf4ff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 20% 0%, #19345a 0, transparent 34rem), #070b14; }
      main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0; }
      header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
      .eyebrow { color: #67e8f9; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; font-weight: 700; }
      h1 { margin: 7px 0 0; font-size: clamp(28px, 4vw, 48px); letter-spacing: -.04em; }
      .status { display: flex; gap: 8px; align-items: center; border: 1px solid #243149; border-radius: 999px; padding: 8px 13px; background: #0c1321; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 12px currentColor; }
      .dot.live { background: #22c55e; }
      .grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(270px, .8fr); gap: 20px; }
      .card { border: 1px solid #1e2c43; background: rgba(12, 19, 33, .88); border-radius: 20px; box-shadow: 0 20px 70px #0006; }
      .conversation { min-height: 570px; display: flex; flex-direction: column; overflow: hidden; }
      .card-title { padding: 18px 22px; border-bottom: 1px solid #1e2c43; display: flex; justify-content: space-between; }
      .phase { color: #93c5fd; font-family: ui-monospace, monospace; }
      #messages { padding: 24px; display: flex; flex: 1; flex-direction: column; gap: 14px; overflow-y: auto; max-height: 410px; }
      .message { max-width: 82%; border-radius: 15px; padding: 12px 15px; line-height: 1.5; animation: rise .2s ease-out; }
      .agent { align-self: flex-start; background: #14213a; border: 1px solid #263a5f; }
      .user { align-self: flex-end; background: #155e75; }
      .system { align-self: center; color: #8ca1bd; font-size: 13px; padding: 4px; }
      .controls { padding: 18px; border-top: 1px solid #1e2c43; display: grid; grid-template-columns: 1fr auto auto; gap: 10px; }
      input, button { border-radius: 12px; border: 1px solid #2b3c58; color: inherit; font: inherit; }
      input { min-width: 0; padding: 13px 14px; background: #090f1b; outline: none; }
      input:focus { border-color: #38bdf8; }
      button { padding: 0 16px; background: #17243b; cursor: pointer; font-weight: 650; }
      button:hover { background: #203353; }
      #talk { width: 50px; padding: 0; border-radius: 50%; background: #0891b2; font-size: 20px; }
      #talk.recording { background: #e11d48; animation: pulse 1.3s infinite; }
      aside { display: flex; flex-direction: column; gap: 20px; }
      .metric { padding: 22px; }
      .metric small { color: #8ca1bd; }
      .metric strong { display: block; margin-top: 8px; font-size: 34px; }
      .trace { padding: 20px; }
      .trace ol { padding-left: 22px; color: #9fb0c7; line-height: 2.1; }
      .trace li::marker { color: #22d3ee; font-weight: 700; }
      code { color: #a5f3fc; }
      @keyframes pulse { 50% { box-shadow: 0 0 0 8px #e11d4433; } }
      @keyframes rise { from { opacity: 0; transform: translateY(5px); } }
      @media (max-width: 780px) { .grid { grid-template-columns: 1fr; } header { align-items: flex-start; gap: 18px; } .controls { grid-template-columns: 1fr auto; } #send { display: none; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><div class="eyebrow">Realtime demo</div><h1>Voice Agent Console</h1></div>
        <div class="status"><span id="dot" class="dot"></span><span id="connection">Connecting</span></div>
      </header>
      <div class="grid">
        <section class="card conversation">
          <div class="card-title"><span>Live conversation</span><span id="phase" class="phase">idle</span></div>
          <div id="messages"><div class="message system">Connecting to the gateway…</div></div>
          <form id="form" class="controls">
            <input id="text" aria-label="Message" placeholder="Ask about architecture or latency…" autocomplete="off" />
            <button id="send" type="submit">Send</button>
            <button id="talk" type="button" title="Hold to stream microphone audio">●</button>
          </form>
        </section>
        <aside>
          <section class="card metric"><small>First response token</small><strong id="firstToken">—</strong></section>
          <section class="card metric"><small>End-to-end turn</small><strong id="total">—</strong></section>
          <section class="card trace">
            <div class="eyebrow">Active path</div>
            <ol><li>WebRTC-ready browser audio</li><li>WebSocket gateway</li><li>Go session orchestrator</li><li>Mock STT → LLM → TTS</li></ol>
            <small>Session <code id="session">pending</code></small>
          </section>
        </aside>
      </div>
    </main>
    <script type="module">
      const messages = document.querySelector('#messages');
      const phase = document.querySelector('#phase');
      const connection = document.querySelector('#connection');
      const dot = document.querySelector('#dot');
      const input = document.querySelector('#text');
      const talk = document.querySelector('#talk');
      const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
      let recorder;
      let stream;

      const add = (text, kind) => {
        if (kind !== 'system') [...messages.querySelectorAll('.system')].forEach((el) => el.remove());
        const node = document.createElement('div');
        node.className = `message ${kind}`;
        node.textContent = text;
        messages.append(node);
        messages.scrollTop = messages.scrollHeight;
      };
      const send = (event) => socket.readyState === WebSocket.OPEN && socket.send(JSON.stringify(event));

      socket.addEventListener('open', () => { connection.textContent = 'Connected'; dot.classList.add('live'); });
      socket.addEventListener('close', () => { connection.textContent = 'Disconnected'; dot.classList.remove('live'); });
      socket.addEventListener('message', ({ data }) => {
        const event = JSON.parse(data);
        if (event.type === 'session.ready') document.querySelector('#session').textContent = event.sessionId.slice(0, 8);
        if (event.type === 'session.phase') phase.textContent = event.phase;
        if (event.type === 'transcript.partial') add(event.text, 'system');
        if (event.type === 'transcript.final') add(event.text, 'user');
        if (event.type === 'agent.text') {
          add(event.text, 'agent');
          if ('speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance(event.text));
        }
        if (event.type === 'metrics.latency') {
          document.querySelector('#firstToken').textContent = `${event.firstTokenMs} ms`;
          document.querySelector('#total').textContent = `${event.totalMs} ms`;
        }
        if (event.type === 'error') add(event.message, 'system');
      });

      document.querySelector('#form').addEventListener('submit', (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        send({ type: 'input.text', text });
        input.value = '';
      });

      const startTalking = async () => {
        if (recorder?.state === 'recording') return;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          recorder = new MediaRecorder(stream);
          send({ type: 'input.audio.start' });
          recorder.addEventListener('dataavailable', async ({ data }) => {
            if (data.size && socket.readyState === WebSocket.OPEN) socket.send(await data.arrayBuffer());
          });
          recorder.start(100);
          talk.classList.add('recording');
        } catch (error) { add(`Microphone unavailable: ${error.message}`, 'system'); }
      };
      const stopTalking = () => {
        if (recorder?.state !== 'recording') return;
        recorder.addEventListener('stop', () => send({ type: 'input.audio.commit' }), { once: true });
        recorder.stop();
        stream?.getTracks().forEach((track) => track.stop());
        talk.classList.remove('recording');
      };
      talk.addEventListener('pointerdown', startTalking);
      talk.addEventListener('pointerup', stopTalking);
      talk.addEventListener('pointerleave', stopTalking);
      window.addEventListener('beforeunload', () => send({ type: 'session.end' }));
    </script>
  </body>
</html>
